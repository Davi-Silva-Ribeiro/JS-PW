<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var x = parseFloat(prompt("Informe um numero (Onde falarei sele e primo ou não): "))
        
            if(x <= 0){
                alert("ele não e valido")
            }
            else if(x == 2 || x == 3 || x == 5){
                alert("Ele é primo")
            }
            else if(x % 2 == 0 || x % 3 == 0 || x % 5 == 0){
                alert("Ele não e primo")
            }
            else{
                alert("ELe é primo")
            }
        
    </script>
</body>
</html>
