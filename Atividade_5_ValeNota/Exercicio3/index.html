<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var n  = parseInt(prompt ("Informe valores"))
        if(n >= 1){
           alert ("Seu número e " + n + " então ele e positivo")
        }
        else if(n <= -0 ){
            alert ("Seu número e " + n + " então ele e negativo")
        }
        else if(n == 0){
            alert ("Seu númeor e " + n + " então ele e o meio termo")
        }
    </script>
</body>
</html>
